name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 tests/run_tests.py
      - name: Compile Python
        run: python3 -m py_compile scripts/route.py tests/run_tests.py
      - name: GitHub preflight
        run: scripts/github-preflight.sh
